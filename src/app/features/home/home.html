<section class="home">
  <h1 class="home__title">Scegli una sfida</h1>
  <p class="home__subtitle">Seleziona l'esercizio con cui vuoi allenarti oggi.</p>

  <div class="home__grid">
    @for (challenge of challenges; track challenge.route) {
      <a
        class="challenge-card"
        [class.challenge-card--highlight]="challenge.highlight"
        [routerLink]="challenge.route"
      >
        @if (mostraStato() && isSuperato(challenge)) {
          <span class="challenge-card__badge challenge-card__badge--done" title="Gioco superato">✅ Superato</span>
        }
        <span class="challenge-card__icon">{{ challenge.icon }}</span>
        <h2 class="challenge-card__title">{{ challenge.title }}</h2>
        <p class="challenge-card__description">{{ challenge.description }}</p>
      </a>
    }
  </div>
</section>

<!-- Accesso proposto all'apertura dell'app: si può anche giocare senza. -->
<dialog #loginDialog class="login-dialog" aria-label="Accedi">
  <app-login [embedded]="true" (done)="onLoggedIn()" />
  <button type="button" class="login-dialog__skip" (click)="closeLogin()">Continua senza accedere</button>
</dialog>
